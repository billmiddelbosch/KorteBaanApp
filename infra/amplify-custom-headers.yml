# Security headers for the Amplify-hosted frontend (both the staging and production branch).
# Paste into Amplify console → Hosting → Custom headers, or copy to the repo root as customHttp.yml.
# connect-src allows the API Gateway stages in eu-west-2 (see ApiStack outputs).
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=31536000; includeSubDomains'
      - key: Content-Security-Policy
        value: "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.execute-api.eu-west-2.amazonaws.com; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; frame-ancestors 'none'"
      - key: X-Frame-Options
        value: DENY
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: 'camera=(), microphone=(), geolocation=()'
